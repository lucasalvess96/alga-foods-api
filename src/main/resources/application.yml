spring:
  application:
    name: alga-foods-api

  flyway:
    locations: classpath:db/migration
    default-schema: foods
    schemas: foods, dbo
    create-schemas: false
    baseline-version: 1
    baseline-description: Estrutura existente antes do Flyway
    baseline-on-migrate: ${FLYWAY_BASELINE_ON_MIGRATE:false}
    clean-disabled: true

  session:
    timeout: 380m
    jdbc:
      initialize-schema: never
      platform: sqlserver

  # datasource
  datasource:
    url: jdbc:sqlserver://LUCAS-ALVES:1433;databaseName=AlgaFoods;encrypt=false
    username: usr_alga_foods
    password: algaF00ds#
    driver-class-name: com.microsoft.sqlserver.jdbc.SQLServerDriver

  # JPA
  jpa:
    database-platform: org.hibernate.dialect.SQLServerDialect
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  #serialization
  jackson:
    serialization:
      fail-on-empty-beans: false

  #spring security
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            scope:
              - openid
              - profile
              - email
      redirect-url: ${OAUTH2_REDIRECT_URL:http://localhost:4200/login}


server:
  error:
    include-stacktrace: NEVER
